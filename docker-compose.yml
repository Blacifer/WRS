# WRS Raipur QC Platform — deployment compose file.
#
# Before first run:
#   1. Copy .env.example to .env and fill in a real JWT_SECRET
#      (e.g. `openssl rand -hex 32`).
#   2. `docker compose up -d --build`
#   3. `docker compose exec app node --experimental-strip-types src/db/seed.ts`
#      to create real accounts is NOT what this does — that seeds DEMO data.
#      For real accounts, use the admin API (POST /api/auth/users) once the
#      app is up and you're logged in as an admin — see docs/QUICK_START.md
#      and the rollout plan for the account-creation step.
#
# TLS is NOT handled here — this container serves plain HTTP on port 3000.
# Put it behind the nginx reverse-proxy config in deploy/nginx.conf.example
# (with Let's Encrypt/certbot) so camera/OCR/QR features work — browsers
# require HTTPS (or localhost) for camera access.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # bind to localhost only; nginx proxies from outside
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - wrs_data:/app/server/data

volumes:
  wrs_data:
    driver: local
